[package]
name = "fractal-drivers"
version = "0.1.0"
edition = "2024"
description = "Native harness drivers, delivery and state for Fractal"
license = "MIT"
autotests = false

[dependencies]
# Drivers remain synchronous; daemon ownership admission uses Tokio before blocking submission.
agent-spec = { path = "../agent-spec" }
anyhow = "1"
kdl = "6"
libc = "0.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
fractal-resource-protocol = { path = "../fractal-resource-protocol" }
fractal-resource-providers = { path = "../fractal-resource-providers", optional = true }
fractal-resource-wasip2 = { path = "../fractal-resource-wasip2", optional = true, features = ["runtime"] }
fractal-wire = { path = "../fractal-wire" }
fractal-schema = { path = "../fractal-schema" }
tempfile = "3"
toml = "0.9"
opentelemetry = "0.30"
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["http-json", "reqwest-blocking-client", "internal-logs", "logs"] }
opentelemetry_sdk = { version = "0.30", features = ["spec_unstable_metrics_views", "logs"] }
# `experimental_use_tracing_span_context` stamps the active tracing span's trace/span ids onto
# emitted log records — required so logs correlate with spans without manual context plumbing.
opentelemetry-appender-tracing = { version = "0.30", features = ["experimental_use_tracing_span_context"] }
tracing = "0.1"
tracing-opentelemetry = "0.31"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
tungstenite = "0.30"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
parking_lot = "0.12"
toml = "0.9"
wat = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[features]
# Sandbox wasm resource-profile resolvers (`agent-spec/profile_wasm`). Off by default: the
# runner binary carries no wasmtime unless a build opts in.
wasm-resolver = ["agent-spec/wasm-resolver"]
# Typed Component Model resource providers. This is the sole feature that admits Wasmtime for
# observation; the default driver build remains Wasmtime-free.
wasip2-provider-runtime = [
  "wasm-resolver",
  "dep:fractal-resource-providers",
  "dep:fractal-resource-wasip2",
]
