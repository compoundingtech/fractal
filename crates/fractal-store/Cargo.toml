[package]
name = "fractal-store"
version = "0.1.0"
edition = "2024"
description = "Claims-graph agent reconciler: the store, its domains and the modules they need"
license = "MIT"

[features]
# Forwarded by fractal-daemon's feature of the same name; never enabled by a production build.
test-support = ["fractal-telemetry/test-support", "fractal-secrets/test-support", "fractal-seats-base/test-support", "fractal-delivery-base/test-support", "fractal-missions-base/test-support", "fractal-github-base/test-support", "smallclaims/test-support"]

[dependencies]
agent-spec = { path = "../agent-spec" }
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
ciborium = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
kdl = "6"
libc = "0.2"
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["spec_unstable_metrics_views", "logs"] }
parking_lot = "0.12"
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "79d526d1be4f77bb3764dc1d880492806f8a07fc" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "79d526d1be4f77bb3764dc1d880492806f8a07fc" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Preparation capture uses scalar functions, connection clientdata (bundled SQLite), and transaction hooks.
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
fractal-kernel = { path = "../fractal-kernel" }
fractal-telemetry = { path = "../fractal-telemetry" }
fractal-secrets = { path = "../fractal-secrets" }
fractal-seats-base = { path = "../fractal-seats-base" }
fractal-delivery-base = { path = "../fractal-delivery-base" }
fractal-missions-base = { path = "../fractal-missions-base" }
fractal-github-base = { path = "../fractal-github-base" }
fractal-runtime = { path = "../fractal-runtime" }
fractal-client = { path = "../fractal-client", features = ["trace-propagation"] }
fractal-terminal-direct = { path = "../fractal-terminal-direct" }
fractal-ui-model = { path = "../fractal-ui-model" }
fractal-schema = { path = "../fractal-schema" }
fractal-drivers = { path = "../fractal-drivers" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
toml = "0.9"
tracing = "0.1"
tracing-opentelemetry = "0.31"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
urlencoding = "2"
notify = "8"
walkdir = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
fractal_store_self = { package = "fractal-store", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
opentelemetry_sdk = { version = "0.30", features = ["testing"] }
proptest = "1"
