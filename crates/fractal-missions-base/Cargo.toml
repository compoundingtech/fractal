[package]
name = "fractal-missions-base"
version = "0.1.0"
edition = "2024"
description = "the mission-declaration leaf modules: declaration syntax, gate parsing, provenance and the mission model, which name no store code"
license = "MIT"

[features]
# Forwarded by fractal-daemon's feature of the same name; never enabled by a production build.
test-support = ["fractal-secrets/test-support"]

[dependencies]
fractal-secrets = { path = "../fractal-secrets" }
anyhow = "1"
hex = "0.4"
kdl = "6"
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
fractal-schema = { path = "../fractal-schema" }

[dev-dependencies]
fractal_missions_base_self = { package = "fractal-missions-base", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
