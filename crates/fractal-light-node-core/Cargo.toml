[package]
name = "fractal-light-node-core"
version = "0.1.0"
edition = "2024"
description = "Graph-free durable light-node custody and authenticated sessions"
license = "MIT"

[dependencies]
fractal-auth = { path = "../fractal-auth" }
fractal-wire = { path = "../fractal-wire" }
fractal-schema = { path = "../fractal-schema" }
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
getrandom = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
fractal-auth = { path = "../fractal-auth", features = ["test-support"] }
fractal-store = { path = "../fractal-store", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
