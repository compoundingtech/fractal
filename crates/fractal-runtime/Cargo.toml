[package]
name = "fractal-runtime"
version = "0.1.0"
edition = "2024"
description = "Native process and PTY runtime shared by st2 and st3"
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
portable-pty = "0.9"
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "e237afa8587fb953cc589c35e0c9a252f7192444" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "e237afa8587fb953cc589c35e0c9a252f7192444" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
