[package]
name = "fractal-runtime"
version = "0.1.0"
edition = "2024"
description = "Native process and PTY runtime shared by st2 and Fractal"
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
portable-pty = "0.9"
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "c4348bb7a9fc2f56afb9e774fc00d998213b2262" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "c4348bb7a9fc2f56afb9e774fc00d998213b2262" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
