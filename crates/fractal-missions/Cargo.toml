[package]
name = "fractal-missions"
version = "0.1.0"
edition = "2024"
description = "The missions domain of the store"
license = "MIT"

[features]
# Forwarded by fractal-daemon's feature of the same name; never enabled by a production build.
test-support = ["fractal-delivery/test-support"]

[dependencies]
fractal-delivery = { path = "../fractal-delivery" }
# Shared test modules of the store are named by their own path.
fractal-store = { path = "../fractal-store" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
flate2 = "1"
hex = "0.4"
kdl = "6"
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
fractal-kernel = { path = "../fractal-kernel" }
fractal-schema = { path = "../fractal-schema" }
tempfile = "3"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
fractal_missions_self = { package = "fractal-missions", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
proptest = "1"
