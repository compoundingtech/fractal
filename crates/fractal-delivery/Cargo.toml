[package]
name = "fractal-delivery"
version = "0.1.0"
edition = "2024"
description = "The delivery domain of the store"
license = "MIT"

[features]
# Forwarded by fractal-daemon's feature of the same name; never enabled by a production build.
test-support = ["fractal-store/test-support"]

[dependencies]
fractal-store = { path = "../fractal-store" }
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
ciborium = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures-util = "0.3"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
fractal-kernel = { path = "../fractal-kernel" }
fractal-schema = { path = "../fractal-schema" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v7"] }
fractal-secrets = { path = "../fractal-secrets" }

[dev-dependencies]
fractal_delivery_self = { package = "fractal-delivery", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
proptest = "1"
