[package]
name = "st3-delivery"
version = "0.1.0"
edition = "2024"
description = "The delivery domain of the store"
license = "MIT"

[features]
# Forwarded by st3-daemon's feature of the same name; never enabled by a production build.
test-support = ["st3-store/test-support"]

[dependencies]
st3-store = { path = "../st3-store" }
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
ciborium = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures-util = "0.3"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
st3-kernel = { path = "../st3-kernel" }
st3-schema = { path = "../st3-schema" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v7"] }
st3-secrets = { path = "../st3-secrets" }

[dev-dependencies]
st3_delivery_self = { package = "st3-delivery", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
proptest = "1"
