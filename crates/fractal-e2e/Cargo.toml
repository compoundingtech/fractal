[package]
name = "fractal-e2e"
version = "0.1.0"
edition = "2024"
description = "End-to-end tests that start a real Fractal daemon and drive a client, the terminal UI or the feed against it"
license = "MIT"
publish = false

# Tests only. The daemon library, the client, the UI and the feed are dependencies of the tests, so none of them
# needs a dev-dependency on the daemon any more (fractal-client had one, which closed a cycle with the daemon).

[dev-dependencies]
fractal-daemon = { path = "../fractal-daemon", features = ["test-support"] }
fractal-client = { path = "../fractal-client" }
fractal-feed = { path = "../fractal-feed" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.27"
