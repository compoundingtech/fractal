[package]
name = "st3-terminal-direct"
version = "0.1.0"
edition = "2024"
description = "Reach a terminal's PTY session without an st daemon carrying its bytes: the local socket, or Fabric to the owner host"
license = "MIT"

[dependencies]
anyhow = "1"
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "c5e19e6f6a866cd5cbe0431755e6db38d6f17646" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallclaims = { path = "../smallclaims" }
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }

[dev-dependencies]
tempfile = "3"
