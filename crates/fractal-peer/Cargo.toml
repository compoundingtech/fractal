[package]
name = "fractal-peer"
version = "0.1.0"
edition = "2024"
description = "the node-to-node peer relay and raw terminal routes"
license = "MIT"

[features]
# Forwarded by fractal-daemon's feature of the same name; never enabled by a production build.
test-support = ["fractal-github/test-support"]

[dependencies]
fractal-github = { path = "../fractal-github" }
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
futures-util = "0.3"
hex = "0.4"
notify = "8"
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "063ff7f9d6ef099f76c31752b2eb52c5bba94c17" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "063ff7f9d6ef099f76c31752b2eb52c5bba94c17" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
fractal-client = { path = "../fractal-client", features = ["trace-propagation"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
parking_lot = "0.12"
fractal_peer_self = { package = "fractal-peer", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
jsonschema = { version = "0.33", default-features = false }
