[package]
name = "fractal-fabric-adapter"
version.workspace = true
edition = "2024"
description = "External local st fleet membership to Fabric runtime-peers adapter"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "time"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "st-fabric-adapter"
path = "src/main.rs"
