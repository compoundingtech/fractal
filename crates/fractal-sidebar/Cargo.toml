[package]
name = "fractal-sidebar"
version = "0.1.0"
edition = "2024"
description = "Transport-free Fractal sidebar projection and planning"
license = "MIT"

[features]
default = []
ratatui = ["dep:ratatui"]
client = ["dep:fractal-client"]

[dependencies]
fractal-schema = { path = "../fractal-schema" }
fractal-client = { path = "../fractal-client", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ratatui = { workspace = true, optional = true }

[dev-dependencies]
# Exercise optional adapters and painter in ordinary workspace tests, not consumer builds.
fractal_sidebar_self = { package = "fractal-sidebar", path = ".", features = ["ratatui", "client"] }

jsonschema = { version = "0.33", default-features = false }
