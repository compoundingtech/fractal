[package]
name = "fractal-sidebar"
version = "0.1.0"
edition = "2024"
description = "Transport-free Fractal sidebar projection and planning"
license = "MIT"

[features]
default = []
ratatui = ["dep:ratatui"]

[dependencies]
fractal-schema = { path = "../fractal-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { workspace = true, optional = true }

[dev-dependencies]
# Exercise the optional painter in ordinary workspace tests without enabling it for consumers.
fractal_sidebar_self = { package = "fractal-sidebar", path = ".", features = ["ratatui"] }
jsonschema = { version = "0.33", default-features = false }
