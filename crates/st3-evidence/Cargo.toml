[package]
name = "st3-evidence"
version = "0.1.0"
edition = "2024"
description = "The evidence domain of the store"
license = "MIT"

[features]
# Forwarded by st3-daemon's feature of the same name; never enabled by a production build.
test-support = ["st3-attention/test-support"]

[dependencies]
st3-attention = { path = "../st3-attention" }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
st3-kernel = { path = "../st3-kernel" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
st3_evidence_self = { package = "st3-evidence", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
