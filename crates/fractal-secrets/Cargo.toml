[package]
name = "fractal-secrets"
version = "0.1.0"
edition = "2024"
description = "Claims-graph agent reconciler: the daemon client, startup status, tile registry and credential gateway (sekrets), below the store"
license = "MIT"

[features]
# Forwarded by fractal-daemon's feature of the same name; never enabled by a production build.
test-support = ["fractal-telemetry/test-support", "smallclaims/test-support"]

[dependencies]
fractal-kernel = { path = "../fractal-kernel" }
fractal-telemetry = { path = "../fractal-telemetry" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
libc = "0.2"
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "e237afa8587fb953cc589c35e0c9a252f7192444" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "e237afa8587fb953cc589c35e0c9a252f7192444" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallclaims = { path = "../smallclaims" }
fractal-client = { path = "../fractal-client", features = ["trace-propagation"] }
fractal-terminal-direct = { path = "../fractal-terminal-direct" }
fractal-drivers = { path = "../fractal-drivers" }
fractal-tiles-registry = { path = "../fractal-tiles-registry" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
fractal_secrets_self = { package = "fractal-secrets", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
