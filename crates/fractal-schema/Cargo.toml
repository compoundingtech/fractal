[package]
name = "fractal-schema"
version = "0.1.0"
edition = "2024"
description = "Authoritative st3 subject, resource, and claim registry"
license = "MIT"

[dependencies]
fractal-storage-version = { path = "../fractal-storage-version" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
