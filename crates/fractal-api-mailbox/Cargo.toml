[package]
name = "fractal-api-mailbox"
version = "0.1.0"
edition = "2024"
description = "the mailbox stream API: the per-seat delivery socket, bind, receipts and attachment routes"
license = "MIT"

[features]
# Forwarded by fractal-daemon's feature of the same name; never enabled by a production build.
test-support = ["fractal-api-core/test-support"]

[dependencies]
fractal-api-core = { path = "../fractal-api-core" }
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "79d526d1be4f77bb3764dc1d880492806f8a07fc" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "79d526d1be4f77bb3764dc1d880492806f8a07fc" }
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
fractal-runtime = { path = "../fractal-runtime" }
fractal-drivers = { path = "../fractal-drivers" }
fractal-schema = { path = "../fractal-schema" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"

[dev-dependencies]
fractal_api_mailbox_self = { package = "fractal-api-mailbox", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
