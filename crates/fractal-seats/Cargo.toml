[package]
name = "fractal-seats"
version = "0.1.0"
edition = "2024"
description = "The seats domain of the store"
license = "MIT"

[features]
# Forwarded by fractal-daemon's feature of the same name; never enabled by a production build.
test-support = ["fractal-missions/test-support"]

[dependencies]
fractal-missions = { path = "../fractal-missions" }
# Code that names fractal-store paths directly (shared test modules, main's newer seat tests).
fractal-store = { path = "../fractal-store" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
kdl = "6"
libc = "0.2"
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["spec_unstable_metrics_views", "logs"] }
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
fractal-kernel = { path = "../fractal-kernel" }
fractal-runtime = { path = "../fractal-runtime" }
fractal-client = { path = "../fractal-client", features = ["trace-propagation"] }
fractal-schema = { path = "../fractal-schema" }
fractal-drivers = { path = "../fractal-drivers" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-opentelemetry = "0.31"
uuid = { version = "1", features = ["v4", "v7"] }
walkdir = "2"
fractal-secrets = { path = "../fractal-secrets" }

[dev-dependencies]
fractal_seats_self = { package = "fractal-seats", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
opentelemetry_sdk = { version = "0.30", features = ["testing"] }
proptest = "1"
