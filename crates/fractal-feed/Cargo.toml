[package]
name = "fractal-feed"
version = "0.1.0"
edition = "2024"
description = "Fractal live collection feed, reconnecting subscriptions and read-only snapshots"
license = "MIT"

[dependencies]
anyhow = "1"
fractal-client = { path = "../fractal-client" }
fractal-conversation-ui = { path = "../fractal-conversation-ui" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
tokio = { version = "1", features = ["net"] }
tempfile = "3"
