[package]
name = "fractal-terminal-direct"
version = "0.1.0"
edition = "2024"
description = "Reach a terminal's PTY session without an st daemon carrying its bytes: the local socket, or Fabric to the owner host"
license = "MIT"

[dependencies]
anyhow = "1"
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "063ff7f9d6ef099f76c31752b2eb52c5bba94c17" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallclaims = { path = "../smallclaims" }
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }

[dev-dependencies]
tempfile = "3"
