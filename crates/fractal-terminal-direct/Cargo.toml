[package]
name = "fractal-terminal-direct"
version = "0.1.0"
edition = "2024"
description = "Reach a terminal's PTY session without a Fractal daemon carrying its bytes: the local socket, or Fabric to the owner host"
license = "MIT"

[dependencies]
anyhow = "1"
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "79d526d1be4f77bb3764dc1d880492806f8a07fc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallclaims = { path = "../smallclaims" }
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }

[dev-dependencies]
tempfile = "3"
