[package]
name = "fractal-tui"
version = "0.1.0"
edition = "2024"
description = "Smalltalk terminal UI library"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
crossterm = "0.29"
ratatui = { workspace = true }
smallclaims = { path = "../smallclaims" }
fractal-client = { path = "../fractal-client" }
fractal-terminal-direct = { path = "../fractal-terminal-direct" }
fractal-feed = { path = "../fractal-feed" }
fractal-conversation-ui = { path = "../fractal-conversation-ui", features = ["ratatui"] }
fractal-mission-ui = { path = "../fractal-mission-ui", features = ["ratatui"] }
fractal-ui-model = { path = "../fractal-ui-model" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v7"] }
signal-hook = "0.3"
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml = "0.9"
libc = "0.2"
base64 = "0.22"
flate2 = "1"
unicode-width = "0.2.0"
reqwest = { version = "0.12", default-features = false }
# Thumbnails of attached images: kitty placeholders, sixel or iTerm2, else half blocks.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Agent terminals attached through their PTY session (the gateway's raw stream), drawn here.
alacritty_terminal = { version = "0.26", default-features = false }
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "e237afa8587fb953cc589c35e0c9a252f7192444" }
pty-terminal = { git = "https://github.com/compoundingtech/pty", rev = "e237afa8587fb953cc589c35e0c9a252f7192444" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "e237afa8587fb953cc589c35e0c9a252f7192444" }

# Its own tests run with the crate's, so the timing log it writes stays valid JSON.
[[example]]
name = "phone_client"
test = true

[dev-dependencies]
fractal-schema = { path = "../fractal-schema" }
fractal-daemon = { path = "../fractal-daemon" }
tempfile = "3"
axum = { version = "0.8", features = ["ws"] }
portable-pty = "0.9"
