[package]
name = "st3"
version = "0.1.0"
edition = "2024"
description = "The st3 executable: Fractal's CLI and daemon (crates/fractal) with this build's identity"
license = "MIT"
# The binary and the test of the identity it bakes. Only this package depends on the stamp, so a new
# commit relinks st3 and rebuilds none of the libraries or tests below it (see crates/fractal-build-stamp).

[dependencies]
fractal = { path = "../fractal" }
fractal-build-stamp = { path = "../fractal-build-stamp" }

[dev-dependencies]
fractal-daemon = { path = "../fractal-daemon", features = ["test-support"] }
fractal-drivers = { path = "../fractal-drivers" }
serde_json = "1"
tempfile = "3"

# LIVE-MIGRATION BRIDGE arn:lmig:smalltalk:2026-10-16-fractal-binary-aliases — DELETE at contraction — https://github.com/compoundingtech/fractal/issues/3032
# Keep the existing executable target; fractal dispatches through installed links to it.
[[bin]]
name = "st3"
path = "src/main.rs"
# LIVE-MIGRATION END arn:lmig:smalltalk:2026-10-16-fractal-binary-aliases
