[package]
name = "st3-api-client-v0"
version = "0.1.0"
edition = "2024"
description = "the client-v0 API: the client contract's collections, streams, assistant reads and their routes"
license = "MIT"

[features]
# Forwarded by st3-daemon's feature of the same name; never enabled by a production build.
test-support = ["st3-api-core/test-support"]

[dependencies]
st3-api-core = { path = "../st3-api-core" }
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
kdl = "6"
libc = "0.2"
notify = "8"
opentelemetry = "0.30"
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "063ff7f9d6ef099f76c31752b2eb52c5bba94c17" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "063ff7f9d6ef099f76c31752b2eb52c5bba94c17" }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
smallclaims = { path = "../smallclaims" }
st-runtime = { path = "../st-runtime" }
st3-client = { path = "../st3-client", features = ["trace-propagation"] }
st3-ui-model = { path = "../st3-ui-model" }
st3-schema = { path = "../st3-schema" }
st-drivers = { path = "../st-drivers" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
tracing = "0.1"
tracing-opentelemetry = "0.31"
tower = { version = "0.5", features = ["util"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
st3_api_client_v0_self = { package = "st3-api-client-v0", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
jsonschema = { version = "0.33", default-features = false }
