[package]
name = "fractal-client-tui"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Small client built from Small Talk's reusable pieces"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = { workspace = true }
fractal-client = { path = "../../crates/fractal-client" }
fractal-feed = { path = "../../crates/fractal-feed" }
fractal-conversation-ui = { path = "../../crates/fractal-conversation-ui", features = ["ratatui"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
serde_json = "1"

[[bin]]
name = "st3-client-tui"
path = "src/main.rs"
