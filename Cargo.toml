  "crates/fractal-runtime",
  "crates/fractal-resource-protocol",
  "crates/fractal-wire",
  "crates/fractal",
  "crates/fractal-daemon",
  "crates/fractal-e2e",
  "crates/fractal-kernel",
  "crates/fractal-telemetry",
  "crates/fractal-secrets",
  "crates/fractal-seats-base",
  "crates/fractal-delivery-base",
  "crates/fractal-missions-base",
  "crates/fractal-github-base",
  "crates/fractal-store",
  "crates/fractal-github",
  "crates/fractal-peer",
  "crates/fractal-reconcile",
  "crates/fractal-api-core",
  "crates/fractal-client",
