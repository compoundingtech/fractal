exclude = ["vendor/libghostty-vt-sys"]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }

# The published 0.2.1 crate with one build-script change so Zig 0.15.2 can link against current
# macOS SDKs; see vendor/libghostty-vt-sys/README.md.
[patch.crates-io]
libghostty-vt-sys = { path = "vendor/libghostty-vt-sys" }

# Debug assertions are OFF in the dev and test profiles and ON in release-with-assertions runs
# (docs/ci.md, "Debug assertions"): measured on the same tree, they cost about 21% of compile CPU
# and 26% of a cold compile's wall time, and about 14% of a debug-glue-heavy test's CPU (std's
# unsafe-precondition checks and debug_assert! in every crate). Overflow checks, assert! and
# bounds checks stay on. To run a build with the assertions: CARGO_PROFILE_DEV_DEBUG_ASSERTIONS=true
# CARGO_PROFILE_TEST_DEBUG_ASSERTIONS=true. The profile is part of the tree, so a signed run binds it.
[profile.dev]
debug = 1
debug-assertions = false
overflow-checks = true

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
debug-assertions = false
overflow-checks = true

[profile.test.package."*"]
debug = 0

# The fractal-daemon library unit test is the largest rustc in the workspace; its debug info costs
# about 2 GB of peak memory and a third of its executable. Backtraces keep function names.
[profile.test.package.fractal-daemon]
debug = 0

# Optimize hot third-party code in dev/test while preserving assertions (these four keep
# debug-assertions on at opt-level 3, where they are cheap) and the existing no-debug-info
# dependency policy. Workspace crates retain opt-level 0.

[profile.dev.package.libsqlite3-sys]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.dev.package.sha2]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.dev.package.ring]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.dev.package.serde_json]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.test.package.libsqlite3-sys]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.test.package.sha2]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.test.package.ring]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.test.package.serde_json]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[package]
name = "fractal-legacy-runner"
version.workspace = true
edition = "2024"
description = "Harness-agnostic runner: reconcile a unified catalog+inbox folder of rendered agent specs, keep their ptys running, and deliver messages by moving inbox files."
license = "MIT"
# Every file in tests/ is a module of one test binary; see tests/integration.rs.
autotests = false

[[bin]]
name = "st2"
path = "src/main.rs"

[lib]
name = "fractal_legacy_runner"
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

# These set process-wide environment variables, so each stays a test binary of its own.
[[test]]
name = "agent_resource"
path = "tests/agent_resource.rs"

[[test]]
name = "driver_expansion"
path = "tests/driver_expansion.rs"

[[test]]
name = "event_e2e"
path = "tests/event_e2e.rs"

[[test]]
name = "resource_profile_supervisor_e2e"
path = "tests/resource_profile_supervisor_e2e.rs"

[dependencies]
# Sync by design: the runner is I/O-light (shell-outs to `pty` plus a
# folder watch + a sleep), so no tokio. Deps grow per milestone; M0 needs only parse + CLI.
agent-spec = { path = "crates/agent-spec" }
# The build identity: only the binary packages depend on it (see crates/fractal-build-stamp).
fractal-build-stamp = { path = "crates/fractal-build-stamp" }
fractal-drivers = { path = "crates/fractal-drivers" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
kdl = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fractal-resource-protocol = { package = "fractal-resource-protocol", path = "crates/fractal-resource-protocol" }
fractal-resource-providers = { path = "crates/fractal-resource-providers", optional = true }
fractal-resource-wasip2 = { path = "crates/fractal-resource-wasip2", optional = true, features = ["runtime"] }
fractal-wire = { package = "fractal-wire", path = "crates/fractal-wire" }
tempfile = "3"
tracing = "0.1"

[dev-dependencies]
libc = "0.2"
parking_lot = "0.12"

[features]
# Sandbox wasm resource-profile resolvers (`agent-spec/profile_wasm`). Off by default: the
# runner binary carries no wasmtime unless a build opts in.
wasm-resolver = ["agent-spec/wasm-resolver", "fractal-drivers/wasm-resolver"]
# Typed Component Model resource providers. This is the sole feature that admits Wasmtime for
# observation; default members and the default fractal-legacy-runner binary remain Wasmtime-free.
wasip2-provider-runtime = [
  "wasm-resolver",
  "dep:fractal-resource-providers",
  "dep:fractal-resource-wasip2",
  "fractal-drivers/wasip2-provider-runtime",
]
