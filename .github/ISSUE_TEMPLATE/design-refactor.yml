name: Design / refactor
description: Propose a design change or refactoring.
labels: ['type:chore']
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Review every excerpt before posting. Use invented host names, paths and person and seat IDs. Remove credentials, keys, pairing/invite secrets, transcript prompts and claim/document bodies; link to internal documents by ref instead of pasting them.
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Problem / motivation
    validations:
      required: true
  - type: textarea
    id: direction
    attributes:
      label: Proposed direction
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / non-goals
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
