name: Draft CI admission

on:
  workflow_run:
    workflows:
      - Workspace CI
      - Performance
      - Public repository check
      - Nix
      - macOS CI
      - Smalltalk tag release
      - fractal-web
    types: [requested]

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: "draft-ci-admission-${{ github.event.workflow_run.id }}"
  cancel-in-progress: false

jobs:
  admission:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only a currently draft PR run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'DRAFT_ADMISSION_PY'
          #!/usr/bin/env python3
          """Cancel a draft PR's requested run using metadata and trusted default-branch code."""
          import json
          import os
          import re
          import time
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          WORKFLOWS = ('Workspace CI', 'Performance', 'Public repository check',
                       'Nix', 'macOS CI', 'Smalltalk tag release', 'fractal-web')


          def identity(run, repository, run_id):
              if (type(run.get('id')) is not int or run.get('id') != run_id or
                      run.get('repository', {}).get('full_name') != repository):
                  raise ValueError('workflow run identity does not match the requested repository/run')
              if (not isinstance(run.get('head_sha'), str) or not re.fullmatch(r'[a-f0-9]{40}', run['head_sha'])
                      or not isinstance(run.get('head_branch'), str) or not run['head_branch']):
                  raise ValueError('workflow run source identity is unqualified')
              return (run.get('event'), run.get('head_sha'), run.get('head_branch'), run.get('name'))


          def pull_numbers(api, repository, run):
              linked = run.get('pull_requests')
              if not isinstance(linked, list):
                  raise ValueError('workflow run has no qualified pull-request metadata')
              if not linked:
                  # GitHub can omit fork PR links in workflow_run. Resolve that explicit case
                  # using the source repository and branch, never a branch name alone.
                  head_repo = run.get('head_repository') or {}
                  owner = (head_repo.get('owner') or {}).get('login')
                  full_name, branch = head_repo.get('full_name'), run.get('head_branch')
                  if not owner or not full_name or not branch:
                      raise ValueError('unlinked run has no qualified source repository/branch')
                  linked = api(f'repos/{repository}/pulls?state=open&head={quote(owner + ":" + branch, safe="")}&per_page=100')
                  if not isinstance(linked, list) or len(linked) >= 100:
                      raise ValueError('pull-request association is incomplete')
                  linked = [pr for pr in linked if
                            (pr.get('head', {}).get('repo') or {}).get('full_name') == full_name
                            and pr.get('head', {}).get('ref') == branch]
              numbers = {pr.get('number') for pr in linked}
              if len(numbers) > 20 or any(type(number) is not int or number <= 0 for number in numbers):
                  raise ValueError('invalid or excessive pull-request association')
              return sorted(numbers)


          def drafts(api, repository, run, numbers):
              head_repository = (run.get('head_repository') or {}).get('full_name')
              if not isinstance(head_repository, str) or not re.fullmatch(r'[\w.-]+/[\w.-]+', head_repository):
                  raise ValueError('workflow run source repository is unqualified')
              open_prs = []
              for number in numbers:
                  pr = api(f'repos/{repository}/pulls/{number}')
                  if (type(pr.get('number')) is not int or pr.get('number') != number or
                          (pr.get('base', {}).get('repo') or {}).get('full_name') != repository or
                          (pr.get('head', {}).get('repo') or {}).get('full_name') != head_repository or
                          pr.get('head', {}).get('ref') != run.get('head_branch')):
                      raise ValueError('pull-request identity does not match the workflow run')
                  if pr.get('state') == 'closed':
                      continue
                  if pr.get('state') != 'open' or type(pr.get('draft')) is not bool:
                      raise ValueError('pull-request state/draft identity is unqualified')
                  if not pr['draft']:
                      return False
                  open_prs.append(number)
              return bool(open_prs)


          def cancel_draft(api, repository, run_id):
              path = f'repos/{repository}/actions/runs/{run_id}'
              run = api(path)
              original = identity(run, repository, run_id)
              if run.get('event') != 'pull_request' or run.get('name') not in WORKFLOWS:
                  return {'decision': 'not-a-watched-pr-run', 'run_id': run_id}
              if run.get('status') == 'completed':
                  return {'decision': 'already-completed', 'run_id': run_id}
              if run.get('status') not in ('queued', 'in_progress', 'waiting', 'pending', 'requested'):
                  raise ValueError('workflow run status is unqualified')
              numbers = pull_numbers(api, repository, run)
              if not drafts(api, repository, run, numbers):
                  return {'decision': 'no-open-draft-only-association', 'run_id': run_id}
              # The event payload may already be stale. Recheck the target and every PR
              # immediately before the POST; a ready PR or changed association is preserved.
              current = api(path)
              if identity(current, repository, run_id) != original:
                  raise ValueError('workflow run identity changed before cancellation')
              if current.get('status') == 'completed':
                  return {'decision': 'completed-before-request', 'run_id': run_id}
              if current.get('status') not in ('queued', 'in_progress', 'waiting', 'pending', 'requested'):
                  raise ValueError('workflow run status changed to an unqualified value')
              if pull_numbers(api, repository, current) != numbers or not drafts(api, repository, current, numbers):
                  return {'decision': 'association-or-readiness-changed', 'run_id': run_id}
              requested_at = time.strftime('%FT%TZ', time.gmtime())
              api(path + '/cancel', 'POST')
              return {'decision': 'cancel-request-accepted', 'run_id': run_id,
                      'pull_requests': numbers, 'head_sha': run['head_sha'], 'requested_at': requested_at,
                      'closure': 'asynchronous; accepted request is not terminal cancellation proof'}


          def main():
              repository, value = os.environ['REPOSITORY'], os.environ['RUN_ID']
              if not re.fullmatch(r'[\w.-]+/[\w.-]+', repository) or not value.isdecimal() or int(value) <= 0:
                  raise ValueError('invalid repository/run identity')
              token, end, calls = os.environ['GH_TOKEN'], time.monotonic() + 120, 0

              def api(path, method='GET'):
                  nonlocal calls
                  calls += 1
                  left = end - time.monotonic()
                  if calls > 50 or left <= 0:
                      raise RuntimeError('metadata request budget exhausted')
                  request = Request('https://api.github.com/' + path, method=method,
                                    headers={'Authorization': 'Bearer ' + token,
                                             'Accept': 'application/vnd.github+json',
                                             'X-GitHub-Api-Version': '2022-11-28'})
                  try:
                      with urlopen(request, timeout=min(10, left)) as response:
                          if method == 'POST':
                              if response.status != 202:
                                  raise RuntimeError('cancellation was not accepted')
                              return None
                          return json.load(response)
                  except HTTPError as error:
                      raise RuntimeError(f'metadata API {method} failed: HTTP {error.code}') from None

              result = cancel_draft(api, repository, int(value))
              message = json.dumps(result, sort_keys=True)
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(message + '\n')


          if __name__ == '__main__':
              main()

          DRAFT_ADMISSION_PY
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_REASON: Reads PR/run metadata and requests draft cancellation; no checkout, build or cache.
        run: "printf 'Cache coverage: **not applicable** — %s\\n' \"$CACHE_REASON\" >> \"$GITHUB_STEP_SUMMARY\""
