          transport() { grep -Eq 'HTTP (408|429|5[0-9][0-9])|RPC failed|remote end hung up|early EOF|Connection (timed out|reset)|Operation timed out' "$errors"; }
          [ ! -f "$shallow" ] || mv "$shallow" "$shallow.full-fetch"
