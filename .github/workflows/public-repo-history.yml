            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_VALUE_0
          fi
          head=$(git rev-parse HEAD)
          shallow=$(git rev-parse --git-path shallow)
          errors=$(mktemp)
          fetch() {
