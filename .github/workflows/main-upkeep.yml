  proof-genie-freshness:
    name: post-merge genie-freshness
    env:
      CI_CACHE_DEV_SHELL: genie
    needs: [main-checks, proof-pick-runner, proof-evidence-gate-genie-freshness]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.main-checks.outputs.evidence-skipped == 'true' && ( (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (!cancelled()) ) }}
