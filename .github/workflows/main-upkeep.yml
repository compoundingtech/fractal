                      # Resolve the live target ref in this isolated repo; never fall back to a stale tip.
                      if not base_ref.startswith("refs/heads/"):
                          raise ValueError(f"invalid merge group base ref: {base_ref!r}")
                      git(directory, "fetch", "--quiet", "--no-tags", "--filter=blob:none", remote, base_ref)
                      target = git(directory, "rev-parse", "FETCH_HEAD").strip()
                      start = git(directory, "merge-base", target, head).strip()
                  else:
                      start = git(directory, "merge-base", base, head).strip() if event == "pull_request" else base
                  if not SHA.fullmatch(start):
                      raise ValueError(f"no merge base for {base} and {head}")
                  output = git(directory, "diff", "--name-only", "--no-renames", "-z", start, head)
              return [path for path in output.split("\0") if path]


          def main():
              event = os.environ.get("EVENT", "")
              summary = []
              if event == "workflow_dispatch":
                  relevant, kit_inputs, summary = True, True, ["Manual run: web execution and kit plays are forced."]
              elif event in ("pull_request", "merge_group", "push"):
                  try:
                      paths = changed_paths(os.environ["REMOTE"], event, os.environ.get("BASE_SHA", ""), os.environ.get("HEAD_SHA", ""),
                                            os.environ.get("BASE_REF", "refs/heads/main"))
                  except (ValueError, subprocess.SubprocessError, OSError) as error:
                      detail = error.stderr.strip() if isinstance(error, subprocess.CalledProcessError) else str(error)
                      print(f"::warning::fractal-web diff unknown; running all lanes: {detail}", file=sys.stderr)
                      relevant, kit_inputs = True, True
                      summary = ["Diff unavailable: all web lanes, including kit plays, are required."]
                  else:
                      matched = relevant_paths(paths)
                      relevant = bool(matched)
                      kit_inputs = bool(kit_paths(paths))
                      summary = [f"{len(paths)} changed path(s), {len(matched)} web-relevant."] + [f"- `{path}`" for path in matched[:50]]
              else:
                  raise ValueError(f"unsupported event {event!r}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"relevant={'true' if relevant else 'false'}\n")
                  output.write(f"kit-inputs={'true' if kit_inputs else 'false'}\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as step_summary:
                  step_summary.write("\n".join([f"fractal-web execution: **{'required' if relevant else 'not required'}**", *summary]) + "\n")
              print(f"relevant={'true' if relevant else 'false'}")
              print(f"kit-inputs={'true' if kit_inputs else 'false'}")
              return 0


          if __name__ == "__main__":
              try:
                  sys.exit(main())
              except Exception as error:  # Fail closed on every detector error.
                  detail = error.stderr.strip() if isinstance(error, subprocess.CalledProcessError) else str(error)
                  print(f"::error::fractal-web change detection failed: {detail}", file=sys.stderr)
                  sys.exit(1)

          PY
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_REASON: Diffs two fetched commits without blobs and builds nothing.
        run: "printf 'Cache coverage: **not applicable** — %s\\n' \"$CACHE_REASON\" >> \"$GITHUB_STEP_SUMMARY\""
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.main-checks.outputs.evidence-skipped == 'true' && ( (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (success()) ) }}
    needs: [main-checks]
  proof-fractal-web-execution:
    name: post-merge fractal-web-execution
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.proof-fractal-web-changes.outputs.kit-inputs == 'true' && github.event_name != 'pull_request' && '{"shard":[0,1,2,3]}' || '{"shard":[0]}') }}
    needs:
      [
        main-checks,
        proof-fractal-web-changes,
        proof-genie-freshness,
        proof-evidence-gate-fractal-web,
      ]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.main-checks.outputs.evidence-skipped == 'true' && ( (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (!cancelled() && needs.proof-fractal-web-changes.result == 'success' && needs.proof-fractal-web-changes.outputs.relevant == 'true' && needs.proof-genie-freshness.result == 'success' && needs.proof-evidence-gate-fractal-web.outputs.skip != 'true' && !(github.event_name == 'pull_request' && needs.proof-evidence-gate-fractal-web.outputs.refuse == 'true')) ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    environment: ${{ (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'evidence-signing' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Identify runner hardware
        shell: bash
        env:
          CI_RUNNER_NAME: ${{ runner.name }}
        run: |
          cpu=$(awk -F ': ' '/^model name/ {print $2; exit}' /proc/cpuinfo)
          printf 'Runner: name=%s region=%s cpu=%s cores=%s\n' "$CI_RUNNER_NAME" "${RUNNER_REGION:-${AWS_REGION:-${AZURE_REGION:-unknown}}}" "$cpu" "$(nproc)"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
            ${{ runner.os == 'Linux' && 'sandbox = true' || '' }}
            ${{ runner.os == 'Linux' && 'sandbox-fallback = false' || '' }}
          summarize: true
      - name: Materialize megarepo members
        env:
          MEGAREPO_STORE: "${{ runner.temp }}/megarepo"
        run: |
          nix run "github:overengineeringstudio/effect-utils/$(jq -r '.nodes["effect-utils"].locked.rev' flake.lock)#megarepo" -- apply --worktree-mode commit --git-protocol https
          printf 'MEGAREPO_STORE=%s\n' "$MEGAREPO_STORE" >> "$GITHUB_ENV"
      - name: Check web shell identity invariants
        run: python3 scripts/ci-web-shell-test
      - name: Identify the web shell inputs
        id: web-shell-key
        shell: bash
        env:
          CI_WEB_SHELL_SOURCE_HASH: ${{ hashFiles('nix/web-shell.nix', 'nix/web-shell-inputs.json', 'scripts/ci-web-shell', 'scripts/ci-web-shell-inputs.jq') }}
        run: bash scripts/ci-web-shell key
      - name: Restore the pnpm store
        id: pnpm-store
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.temp }}/pnpm-store"
          key: "fractal-web-pnpm-${{ runner.os }}-pnpm12.15.0-node24.20.0-${{ hashFiles('pnpm-lock.yaml') }}"
      - name: Enable user namespaces for Buck TypeScript sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Restore the web shell closure
        id: web-shell
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.temp }}/web-shell"
          key: ${{ steps.web-shell-key.outputs.key }}
      - name: Run the fractal-web lanes and dependency license check
        id: run
        shell: bash
        run: bash scripts/ci-web-shell run bash scripts/ci-fractal-web
        env:
          pnpm_config_store_dir: "${{ runner.temp }}/pnpm-store"
          CI_WEB_SHELL_DIR: "${{ runner.temp }}/web-shell"
          CI_WEB_SHELL_KEY: ${{ steps.web-shell-key.outputs.key }}
          KIT_INPUTS: ${{ needs.proof-fractal-web-changes.outputs.kit-inputs }}
          KIT_SHARD_INDEX: ${{ matrix.shard }}
          KIT_SHARD_COUNT: ${{ needs.proof-fractal-web-changes.outputs.kit-inputs == 'true' && github.event_name != 'pull_request' && '4' || '1' }}
          KIT_RECEIPT_DIRECTORY: "${{ runner.temp }}/kit-play-receipts"
          KIT_PLAY_SET: ${{ github.event_name == 'pull_request' && 'commit' || 'all' }}
          KIT_PLAY_A11Y: ${{ github.event_name == 'pull_request' && 'off' || 'on' }}
          KIT_PLAY_WALL_GUARD_SECONDS: ${{ github.event_name == 'pull_request' && '268' || '' }}
          APP_TEST_SET: ${{ github.event_name == 'pull_request' && 'related' || 'all' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Preserve kit shard receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "kit-play-${{ github.run_id }}-${{ github.sha }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/kit-play-receipts/"
          if-no-files-found: ignore
      - if: always()
        continue-on-error: true
        name: Take the evidence signer from the base commit
        id: evidence-base
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.sha }}
        run: |
          rm -rf "$RUNNER_TEMP/evidence-base" && mkdir "$RUNNER_TEMP/evidence-base"
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --quiet --depth=1 origin "$BASE_SHA"
          git archive "$BASE_SHA" scripts | tar -x -C "$RUNNER_TEMP/evidence-base"
      - if: ${{ always() && steps.evidence-base.outcome == 'success' }}
        continue-on-error: true
        name: May this job use the signing key?
        id: evidence-guard
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" guard
      - if: ${{ always() && steps.evidence-guard.outcome == 'success' }}
        continue-on-error: true
        name: Write the signer configuration and key
        id: evidence-configure
        env:
          EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
        run: |
          set -o pipefail
          python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" configure | tee "$RUNNER_TEMP/evidence-signer-home"
      - if: ${{ always() && steps.evidence-configure.outcome == 'success' }}
        continue-on-error: true
        name: Sign this job result
        env:
          STEP_CHECK: fractal-web
          STEP_COMMAND: '["bash","scripts/ci-fractal-web"]'
          STEP_OUTCOMES: '{"run":"${{ steps.run.outcome }}"}'
          STEP_INPUTS: '{"kit_shard":"${{ matrix.shard }}","kit_shard_count":"${{ needs.proof-fractal-web-changes.outputs.kit-inputs == ''true'' && github.event_name != ''pull_request'' && ''4'' || ''1'' }}","kit_play_set":"${{ github.event_name == ''pull_request'' && ''commit'' || ''all'' }}","app_test_set":"${{ github.event_name == ''pull_request'' && ''related'' || ''all'' }}"}'
          GATE_SKIP: ${{ needs.proof-evidence-gate-fractal-web.outputs.skip == 'true' }}
          PROJECT_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.sha }}
        run: |
          helper="$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing"
          python3 "$helper" once "$STEP_CHECK"
          python3 "$helper" step-facts "$RUNNER_TEMP/job-facts.json"
          home=$(tail -n 1 "$RUNNER_TEMP/evidence-signer-home")
          HOME="$home" python3 "$RUNNER_TEMP/evidence-base/scripts/evidence-wrap" --check "$STEP_CHECK" \
            --aggregate "$RUNNER_TEMP/job-facts.json" --attempt "$GITHUB_RUN_ATTEMPT" \
            --change-id "github:$GITHUB_REPOSITORY@$GITHUB_SHA" \
            --signer '["python3","'"$RUNNER_TEMP"'/evidence-base/scripts/evidence-sign"]' \
            --out "$RUNNER_TEMP/evidence-notes" \
            --toolchain-sha256 "$(printf '%s|%s|%s|%s|%s|%s' "$RUNNER_OS" "$RUNNER_ARCH" "${ImageVersion:-}" "$(nix --version 2>/dev/null)" "$(node --version 2>/dev/null)" "$(pnpm --version 2>/dev/null)" | sha256sum | cut -d' ' -f1)"
      - if: always()
        continue-on-error: true
        name: Remove the key
        run: python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" cleanup
      - if: always()
        continue-on-error: true
        name: Retain the signed note
        uses: actions/upload-artifact@v4
        with:
          name: "evidence-note-fractal-web-shard-${{ matrix.shard }}"
          path: "${{ runner.temp }}/evidence-notes/"
          if-no-files-found: ignore
          retention-days: 7
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_ENTRIES: '[{"name":"Restore the pnpm store","outcome":"${{ steps.pnpm-store.outcome }}","hit":"${{ steps.pnpm-store.outputs.cache-hit }}","matched":"${{ steps.pnpm-store.outputs.cache-matched-key }}","opaqueFallback":false,"sourceOnly":false,"avoidable":"","lookup":false},{"name":"Restore the web shell closure","outcome":"${{ steps.web-shell.outcome }}","hit":"${{ steps.web-shell.outputs.cache-hit }}","matched":"${{ steps.web-shell.outputs.cache-matched-key }}","opaqueFallback":false,"sourceOnly":false,"avoidable":"","lookup":false}]'
        run: 'python3 "${CI_CACHE_AUDIT_SCRIPT:-scripts/ci-cache-audit}"'
  proof-fractal-web:
    name: post-merge fractal-web
    needs:
      [
        main-checks,
        proof-fractal-web-changes,
        proof-fractal-web-execution,
        proof-evidence-gate-fractal-web,
      ]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.main-checks.outputs.evidence-skipped == 'true' && ( (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (always()) ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Identify runner hardware
        shell: bash
        env:
          CI_RUNNER_NAME: ${{ runner.name }}
        run: |
          cpu=$(awk -F ': ' '/^model name/ {print $2; exit}' /proc/cpuinfo)
          printf 'Runner: name=%s region=%s cpu=%s cores=%s\n' "$CI_RUNNER_NAME" "${RUNNER_REGION:-${AWS_REGION:-${AZURE_REGION:-unknown}}}" "$cpu" "$(nproc)"
      - name: Require detection and, for web changes, execution
        env:
          CHANGES_RESULT: ${{ needs.proof-fractal-web-changes.result }}
          RELEVANT: ${{ needs.proof-fractal-web-changes.outputs.relevant }}
          EXECUTION_RESULT: ${{ needs.proof-fractal-web-execution.result }}
          EVIDENCE_SKIP: ${{ needs.proof-evidence-gate-fractal-web.outputs.skip }}
          EVIDENCE_REFUSAL: ${{ needs.proof-evidence-gate-fractal-web.outputs.refuse == 'true' && needs.proof-evidence-gate-fractal-web.outputs.refusal || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """The always-emitted fractal-web check: pass only for a deliberate skip or a successful run.

          Detection must have succeeded. A relevant change requires successful execution, except when
          an explicit trusted evidence decision covers a pull request or merge group. Main and manual
          runs require execution. Failure, timeout, cancellation and an unexpected skip fail the gate.
          A signed-only pull request (ours) with web changes and no valid signature is refused, not run:
          the gate fails with the refusal, which says how to sign it.
          """

          import os
          import sys


          def verdict(changes, relevant, execution, evidence_skip="", event="", refusal=""):
              if changes != "success":
                  return f"change detection ended with {changes or 'no result'}"
              if relevant == "true" and refusal and event == "pull_request":
                  return refusal
              if relevant == "true":
                  if execution == "skipped" and evidence_skip == "true" and event in ("pull_request", "merge_group"):
                      return None
                  return None if execution == "success" else f"web inputs changed but execution ended with {execution or 'no result'}"
              if relevant == "false":
                  return None if execution == "skipped" else f"no web inputs changed but execution ended with {execution or 'no result'}"
              return f"change detection reported no decision ({relevant!r})"


          def main():
              changes, relevant, execution = (os.environ.get(name, "") for name in ("CHANGES_RESULT", "RELEVANT", "EXECUTION_RESULT"))
              print(f"detection: {changes}, relevant: {relevant}, execution: {execution}")
              failure = verdict(changes, relevant, execution, os.environ.get("EVIDENCE_SKIP", ""), os.environ.get("EVENT_NAME", ""),
                                os.environ.get("EVIDENCE_REFUSAL", ""))
              if failure:
                  print(f"::error::fractal-web gate failed: {failure}")
                  return 1
              print("fractal-web gate passed")
              return 0


          if __name__ == "__main__":
              sys.exit(main())

          PY
      - uses: actions/checkout@v4
        if: "!cancelled() && needs.proof-fractal-web-changes.outputs.relevant == 'true'"
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        id: cost-receipts
        continue-on-error: true
        if: "!cancelled() && needs.proof-fractal-web-changes.outputs.relevant == 'true' && needs.proof-evidence-gate-fractal-web.outputs.skip != 'true'"
        with:
          pattern: "kit-play-${{ github.run_id }}-${{ github.sha }}-shard-*-attempt-*"
          path: "${{ runner.temp }}/kit-play-receipts"
      - name: Publish web lane costs as a public check annotation
        continue-on-error: true
        if: "!cancelled() && needs.proof-fractal-web-changes.outputs.relevant == 'true' && needs.proof-evidence-gate-fractal-web.outputs.skip != 'true' && steps.cost-receipts.outcome == 'success'"
        run: node packages/fractal-ui/scripts/kit-play-cost.mjs "$RUNNER_TEMP/kit-play-receipts"
      - name: Require every kit shard and exact full-index coverage
        if: needs.proof-fractal-web-changes.outputs.kit-inputs == 'true' && github.event_name != 'pull_request' && needs.proof-fractal-web-changes.outputs.relevant == 'true' && needs.proof-evidence-gate-fractal-web.outputs.skip != 'true'
        run: node packages/fractal-ui/scripts/kit-play-shards.mjs "$RUNNER_TEMP/kit-play-receipts" 4
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_REASON: Collects the detection and execution results and builds nothing.
        run: "printf 'Cache coverage: **not applicable** — %s\\n' \"$CACHE_REASON\" >> \"$GITHUB_STEP_SUMMARY\""
