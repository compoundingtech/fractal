  proof-linux-test-build:
    name: post-merge linux-test-build
    needs:
      [
        main-checks,
        proof-pick-runner,
        proof-evidence-gate-linux-gate,
        proof-evidence-gate-rust-tests,
      ]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.main-checks.outputs.evidence-skipped == 'true' && ( (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && ((!cancelled()) && !((needs.proof-evidence-gate-linux-gate.outputs.skip == 'true' || needs.proof-evidence-gate-rust-tests.outputs.skip == 'true')) && !(needs.proof-evidence-gate-linux-gate.outputs.refuse == 'true')) ) }}
    runs-on: ${{ fromJSON(vars.CI_MERGE_TEST_BUILD_OWNED && (needs.proof-pick-runner.outputs.ci1_build || format('["namespace-profile-{0};job.priority=1;github.run-id={1}"]', vars.CI_MERGE_NAMESPACE_PROFILE || 'linux-x86-64', github.run_id)) || needs.proof-pick-runner.outputs.ci1 || '["ci1-priority"]') }}
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CI_CACHE_DEV_SHELL: default
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.archive.outputs.manifest-sha256 }}
      producer-attempt: ${{ steps.archive.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch the whole history without evidence tags
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git config --local --get-regexp '^http\..*\.extraheader$' || true)" ]; then
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_VALUE_0
          fi
          head=$(git rev-parse HEAD)
          rm -f "$(git rev-parse --git-path shallow)"
          git fetch --quiet --refetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' '^refs/tags/evidence/*' "$head"
          git fsck --connectivity-only --no-dangling --no-progress
      - name: Use the runner's own caches
        run: |
          if [ -n "${CI_LOCAL_CARGO_HOME:-}" ]; then echo CI_LOCAL_CACHES=1 >> "$GITHUB_ENV"; fi
          printf 'CARGO_HOME=%s\nCI_CACHE_DIR=%s\n' "${CI_LOCAL_CARGO_HOME:-$RUNNER_TEMP/cargo-home}" "$RUNNER_TEMP/fractal-ci-cache" >> "$GITHUB_ENV"
      - id: build-snapshot
        name: Restore the exact-source build snapshot
        if: env.CI_LOCAL_CACHES != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SNAPSHOT_PIPELINE: ${{ github.workflow_sha }}
        run: 'python3 "${CI_BUILD_SNAPSHOT_SCRIPT:-scripts/ci-build-snapshot}" restore'
      - name: Restore the Cargo target and registry
        id: cargo-cache
        if: env.CI_LOCAL_CACHES != '1' && env.CI_BUILD_SNAPSHOT_HIT != '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/target
            ${{ runner.temp }}/cargo-home/registry
            ${{ runner.temp }}/cargo-home/git
          key: "cargo-linux-tests-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '.cargo/config.toml') }}"
          restore-keys: "cargo-linux-tests-${{ runner.os }}-"
      - name: Restore the local Nix cache
        id: nix-cache
        if: env.CI_LOCAL_CACHES != '1' && env.CI_BUILD_SNAPSHOT_HIT != '1'
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.temp }}/fractal-ci-cache"
          key: "nix5-linux-tests-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix', '.github/fleet-compat-baseline.json', '.github/messaging-compat-baseline.json') }}"
          restore-keys: |
            nix5-linux-tests-${{ runner.os }}-
            nix4-linux-tests-${{ runner.os }}-
      - name: Remember genuine source inputs before compiling
        run: 'python3 "${CI_BUILD_SNAPSHOT_SCRIPT:-scripts/ci-build-snapshot}" prepare'
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
          summarize: true
      - name: Isolate test home and XDG state
        run: |
          # Cargo's home and the CI cache directory live under RUNNER_TEMP, not HOME: tests get an isolated HOME,
          # and actions/cache expands a leading tilde against the HOME of the step that runs it.
          printf 'CARGO_HOME=%s\nCI_CACHE_DIR=%s\n' "${CI_LOCAL_CARGO_HOME:-$RUNNER_TEMP/cargo-home}" "$RUNNER_TEMP/fractal-ci-cache" >> "$GITHUB_ENV"
          home="$RUNNER_TEMP/test-home"
          mkdir -p "$home" "$home/.config" "$home/.cache" "$home/.local/state"
          printf 'HOME=%s\nXDG_CONFIG_HOME=%s/.config\nXDG_CACHE_HOME=%s/.cache\nXDG_STATE_HOME=%s/.local/state\n' "$home" "$home" "$home" "$home" >> "$GITHUB_ENV"
      - name: Use the cached Nix outputs
        if: env.CI_LOCAL_CACHES != '1'
        run: 'bash scripts/ci-nix-cache use || echo "::warning::the local Nix cache is unavailable; this run builds everything"'
      - name: Prepare the historical messaging channel
        if: runner.os == 'Linux'
        run: |
          binary=$(timeout 10m bash scripts/messaging-compat-binary)
          printf 'FRACTAL_MESSAGING_COMPAT_BIN=%s\nST3_MESSAGING_COMPAT_BIN=%s\n' "$binary" "$binary" >> "$GITHUB_ENV"
      - name: Prepare provider component fixtures
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          components=$(nix build ".#checks.$system.provider-components" --no-link --print-out-paths --print-build-logs)
          for provider in GITHUB_ISSUE GITHUB_PR PTY_STATS VISTA; do
            wasm=$(printf '%s' "$provider" | tr '[:upper:]' '[:lower:]')
            printf 'ST2_%s_COMPONENT=%s/share/st2/providers/st2_%s_component.component.wasm\n' "$provider" "$components" "$wasm" >> "$GITHUB_ENV"
          done
      - name: Compile and archive each selected target group once
        shell: bash
        run: 'nix develop -c bash -c ''python3 scripts/ci-build-memory before || echo "::warning::build memory baseline unavailable"; exec python3 scripts/ci-test-archive build'''
        id: archive
      - name: Report test-build memory after success
        env:
          BUILD_STEP_OUTCOME: ${{ steps.archive.outcome }}
        run: python3 scripts/ci-build-memory after
        if: ${{ success() && steps.archive.outcome == 'success' }}
        continue-on-error: true
      - name: Publish this run attempt’s exact-source test archives
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: "linux-test-archives-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/ci-test-archives"
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - id: build-snapshot-save
        name: Keep valid same-source build outputs
        if: "!cancelled() && (github.event_name != 'merge_group' || vars.CI_OUTAGE_FAST_QUEUE != 'on')"
        env:
          CI_SNAPSHOT_PIPELINE: ${{ github.workflow_sha }}
        run: 'python3 "${CI_BUILD_SNAPSHOT_SCRIPT:-scripts/ci-build-snapshot}" pack'
      - id: build-snapshot-upload
        name: Retain the same-source build snapshot
        if: "!cancelled() && steps.build-snapshot-save.outputs.publish == 'true'"
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-snapshot-save.outputs.name }}
          path: "${{ runner.temp }}/ci-build-snapshot/build.tar.zst"
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          overwrite: true
      - name: Wait before retrying build snapshot retention
        if: "!cancelled() && steps.build-snapshot-upload.outcome == 'failure'"
        timeout-minutes: 1
        shell: bash
        run: 'echo "::warning::Build snapshot upload failed; retrying once in 15 seconds."; sleep 15'
      - name: Retry retaining the same-source build snapshot
        if: "!cancelled() && steps.build-snapshot-upload.outcome == 'failure'"
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-snapshot-save.outputs.name }}
          path: "${{ runner.temp }}/ci-build-snapshot/build.tar.zst"
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          overwrite: true
      - name: Report test-build memory after failure
        env:
          BUILD_STEP_OUTCOME: ${{ steps.archive.outcome }}
        run: 'mkdir -p "$RUNNER_TEMP/ci-build-memory"; (free -m || echo "::warning::free unavailable") | tee "$RUNNER_TEMP/ci-build-memory/free.txt"; python3 scripts/ci-build-memory failure'
        if: ${{ failure() && steps.archive.outcome == 'failure' }}
        continue-on-error: true
      - name: Retain test-build memory evidence
        if: ${{ always() && (steps.archive.outcome == 'success' || steps.archive.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: "test-build-memory-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/ci-build-memory"
          if-no-files-found: warn
          retention-days: 3
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_ENTRIES: '[{"name":"Restore the exact-source build snapshot","outcome":"${{ steps.build-snapshot.outcome }}","hit":"${{ steps.build-snapshot.outputs.cache-hit }}","matched":"","opaqueFallback":true,"sourceOnly":true,"avoidable":"${{ steps.build-snapshot.outputs.avoidable-miss }}","lookup":false},{"name":"Restore the Cargo target and registry","outcome":"${{ steps.cargo-cache.outcome }}","hit":"${{ steps.cargo-cache.outputs.cache-hit }}","matched":"${{ steps.cargo-cache.outputs.cache-matched-key }}","opaqueFallback":false,"sourceOnly":false,"avoidable":"","lookup":false},{"name":"Restore the local Nix cache","outcome":"${{ steps.nix-cache.outcome }}","hit":"${{ steps.nix-cache.outputs.cache-hit }}","matched":"${{ steps.nix-cache.outputs.cache-matched-key }}","opaqueFallback":false,"sourceOnly":false,"avoidable":"","lookup":false}]'
        run: 'python3 "${CI_CACHE_AUDIT_SCRIPT:-scripts/ci-cache-audit}"'
