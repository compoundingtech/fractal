    steps:
      - name: Check out the tested commit
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch the whole history without evidence tags
        continue-on-error: true
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git config --local --get-regexp '^http\..*\.extraheader$' || true)" ]; then
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_VALUE_0
          fi
          head=$(git rev-parse HEAD)
          rm -f "$(git rev-parse --git-path shallow)"
          git fetch --quiet --refetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' '^refs/tags/evidence/*' "$head"
          git fsck --connectivity-only --no-dangling --no-progress
      - name: Take the signer scripts from the base commit
        id: base
        continue-on-error: true
        run: |
          rm -rf "$RUNNER_TEMP/evidence-base" && mkdir "$RUNNER_TEMP/evidence-base"
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --quiet origin "$BASE_SHA"
          git archive "$BASE_SHA" scripts | tar -x -C "$RUNNER_TEMP/evidence-base"
      - name: Collect the test shards' JUnit reports
        if: ${{ steps.base.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: rust-test-junit-*
          path: "${{ runner.temp }}/rust-test-junit"
      - name: Decide which crates may be signed
        id: plan
        if: ${{ steps.base.outcome == 'success' }}
        continue-on-error: true
        run: |
          [ -f "$RUNNER_TEMP/evidence-base/scripts/ci-rust-test-notes" ] || { echo "no ci-rust-test-notes at the base commit; nothing is signed"; exit 1; }
          python3 "$RUNNER_TEMP/evidence-base/scripts/ci-rust-test-notes" plan --reports "$RUNNER_TEMP/rust-test-junit" --out "$RUNNER_TEMP/rust-test-plan"
      - name: May this job use the signing key?
        id: guard
        if: ${{ steps.plan.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" guard
          python3 "$RUNNER_TEMP/evidence-base/scripts/ci-rust-test-notes" guard
      - name: Write the signer configuration and key
        id: configure
        if: ${{ steps.guard.outcome == 'success' }}
        continue-on-error: true
        env:
          EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
        run: |
          set -o pipefail
          python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" configure | tee "$RUNNER_TEMP/evidence-signer-home"
      - name: Sign the per-crate rust-tests notes
        id: sign
        if: ${{ steps.configure.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" once rust-tests
          home=$(tail -n 1 "$RUNNER_TEMP/evidence-signer-home")
          HOME="$home" python3 "$RUNNER_TEMP/evidence-base/scripts/ci-rust-test-notes" sign --plan "$RUNNER_TEMP/rust-test-plan" --out "$RUNNER_TEMP/rust-test-notes"
      - name: Publish the notes that verify
        if: ${{ steps.configure.outcome == 'success' }}
        continue-on-error: true
        run: |
          [ -d "$RUNNER_TEMP/rust-test-notes" ] || { echo "nothing was signed"; exit 0; }
          # arn:lmig:smalltalk:2026-10-27-dot-fractal-config: fall back only on absence at this base.
          key_entry=$(git ls-tree --full-tree "$BASE_SHA" -- .fractal/evidence-keys) || exit 1
          key_path=.st/evidence-keys
          if [ -n "$key_entry" ]; then key_path=.fractal/evidence-keys; fi
          git show "$BASE_SHA:$key_path" > "$RUNNER_TEMP/evidence-keys" || { echo "::warning::cannot read evidence keys at the base commit; nothing is published"; exit 1; }
          python3 "$RUNNER_TEMP/evidence-base/scripts/evidence-publish" --notes "$RUNNER_TEMP/rust-test-notes" --keys "$RUNNER_TEMP/evidence-keys" \
            --checks rust-tests --limit 400 --remote origin
      - name: Remove the key
        if: always()
        continue-on-error: true
        run: python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" cleanup
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_REASON: Signs per-crate notes from the test shards' JUnit reports; builds nothing.
        run: "printf 'Cache coverage: **not applicable** — %s\\n' \"$CACHE_REASON\" >> \"$GITHUB_STEP_SUMMARY\""
  proof-fractal-web-changes:
    name: post-merge fractal-web-changes
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      kit-inputs: ${{ steps.detect.outputs.kit-inputs }}
    steps:
      - name: Identify runner hardware
        shell: bash
        env:
          CI_RUNNER_NAME: ${{ runner.name }}
        run: |
          cpu=$(awk -F ': ' '/^model name/ {print $2; exit}' /proc/cpuinfo)
          printf 'Runner: name=%s region=%s cpu=%s cores=%s\n' "$CI_RUNNER_NAME" "${RUNNER_REGION:-${AWS_REGION:-${AZURE_REGION:-unknown}}}" "$cpu" "$(nproc)"
      - name: Detect web-relevant changes
        id: detect
