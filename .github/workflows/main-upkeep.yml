  proof-upgrade-impact:
    name: post-merge upgrade-impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch the whole history without evidence tags
        env:
          FETCH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git config --local --get-regexp '^http\..*\.extraheader$' || true)" ]; then
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_VALUE_0
          fi
