  proof-linux-gate:
    name: post-merge linux-gate
    needs:
      - main-checks
      - proof-pick-runner
      - proof-evidence-gate-linux-gate
      - proof-linux-test-build
      - proof-upgrade-impact
      - proof-linux-tests
      - proof-linux-tests-shard-2
