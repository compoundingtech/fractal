name: iOS landing screenshots

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ios-landing-screenshots
  cancel-in-progress: false

jobs:
  capture:
    name: Capture the real iOS client
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      MAESTRO_CLI_NO_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
            ${{ runner.os == 'Linux' && 'sandbox = true' || '' }}
            ${{ runner.os == 'Linux' && 'sandbox-fallback = false' || '' }}
          summarize: true
      - name: Materialize megarepo members
        env:
          MEGAREPO_STORE: "${{ runner.temp }}/megarepo"
        run: |
          nix run "github:overengineeringstudio/effect-utils/$(jq -r '.nodes["effect-utils"].locked.rev' flake.lock)#megarepo" -- apply --worktree-mode commit --git-protocol https
          printf 'MEGAREPO_STORE=%s\n' "$MEGAREPO_STORE" >> "$GITHUB_ENV"
      - name: Install locked workspace dependencies
        env:
          pnpm_config_store_dir: "${{ runner.temp }}/pnpm-store"
        run: "nix develop .#web -c pnpm install --frozen-lockfile"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Maestro CLI without an account
        run: |
          mkdir -p "$RUNNER_TEMP/maestro"
          cd "$RUNNER_TEMP/maestro"
          curl --fail --location --silent --show-error https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip --output maestro.zip
          printf '%s  maestro.zip\n' 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a | shasum -a 256 -c -
          unzip -q maestro.zip
          printf '%s\n' "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Build and capture one disposable simulator
        env:
          pnpm_config_store_dir: "${{ runner.temp }}/pnpm-store"
        run: |
          gateway_host=$(/usr/sbin/ipconfig getifaddr en0)
          nix develop .#web -c nix shell nixpkgs#cocoapods -c apps/ios/scripts/landing-screenshots \
            --gateway-host "$gateway_host" --output "$RUNNER_TEMP/ios-landing-screenshots"
      - name: Upload light and dark PNGs
        uses: actions/upload-artifact@v4
        with:
          name: "ios-landing-screenshots-${{ github.sha }}"
          path: "${{ runner.temp }}/ios-landing-screenshots/*.png"
          if-no-files-found: error
          retention-days: 14
      - name: Retain command and service logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ios-landing-screenshots-logs-${{ github.run_id }}"
          path: "${{ runner.temp }}/ios-landing-screenshots/*.log"
          if-no-files-found: ignore
          retention-days: 7
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_REASON: One-off screenshot capture uses read-only upstream Nix caches only; no build cache is uploaded.
        run: "printf 'Cache coverage: **not applicable** — %s\\n' \"$CACHE_REASON\" >> \"$GITHUB_STEP_SUMMARY\""
