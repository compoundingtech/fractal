# Fixture/preliminary source preparation; NOT RUN against the revised UI.
appId: com.compoundingtech.fractal.starter
---
- { "openLink": { "link": "com.compoundingtech.fractal.starter://agent?id=agent/example/atlas/builder" } }
- { "extendedWaitUntil": { "visible": "^Threads, [0-9]+( or more)?$", "timeout": 30000 } }
- { "tapOn": "^Threads, [0-9]+( or more)?$" }
- { "scrollUntilVisible": { "element": { "text": "^More threads$" }, "direction": "DOWN", "timeout": 30000 } }
- { "tapOn": "^More threads$" }
- {
    "scrollUntilVisible":
      { "element": { "text": "Older-page summary — initial, 1 message.*" }, "direction": "DOWN", "timeout": 30000 },
  }
- {
    "runScript":
      {
        "file": "../../../tmp/threads-ios-preview/fixture-control.js",
        "env": { "CONTROL_JSON": '{"update":"older-rest"}' },
      },
  }
- { "tapOn": "Older-page summary — initial, 1 message.*" }
- { "extendedWaitUntil": { "visible": "Older-page summary — REST update, 1 message.*", "timeout": 30000 } }
- { "takeScreenshot": "older-page-rest" }
- {
    "runScript":
      {
        "file": "../../../tmp/threads-ios-preview/fixture-control.js",
        "env": { "CONTROL_JSON": '{"update":"older-live"}' },
      },
  }
- { "extendedWaitUntil": { "visible": "Older-page summary — live update, 1 message.*", "timeout": 30000 } }
# PREVIEW_FINAL_ASSERTIONS
- { "assertVisible": "Older-page summary — live update, 1 message.*" }
- { "assertNotVisible": "Older-page summary — initial, 1 message.*" }
