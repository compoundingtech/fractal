# Fixture/preliminary source preparation; NOT RUN against the revised UI.
appId: com.compoundingtech.fractal.starter
---
- { "openLink": { "link": "com.compoundingtech.fractal.starter://agent?id=agent/example/atlas/builder" } }
- { "extendedWaitUntil": { "visible": "^Threads, [0-9]+( or more)?$", "timeout": 30000 } }
- { "tapOn": "^Threads, [0-9]+( or more)?$" }
- { "tapOn": "Writable thread — fixture, 1 message.*open" }
- {
    "runScript":
      { "file": "../../../tmp/threads-ios-preview/fixture-control.js", "env": { "CONTROL_JSON": '{"state":"error"}' } },
  }
# Wait for the injected inline error to finish changing the group layout.
- { "extendedWaitUntil": { "visible": ".*Fixture thread read failed.*", "timeout": 30000 } }
- {
    "scrollUntilVisible":
      { "element": { "text": "^Retry loading Writable thread — fixture$" }, "direction": "DOWN", "timeout": 30000 },
  }
# Re-center AFTER injection using a gesture inside the nested Threads viewport.
- swipe:
    start: 85%, 70%
    end: 85%, 45%
    duration: 600
- { "assertVisible": "^Open thread$" }
- { "assertVisible": "^Retry loading Writable thread — fixture$" }
- { "assertNotVisible": "^Refresh thread$" }
- { "takeScreenshot": "error-with-retry" }
# PREVIEW_FINAL_ASSERTIONS
- { "assertVisible": ".*Fixture thread read failed.*" }
- { "assertVisible": "^Retry loading Writable thread — fixture$" }
- { "assertVisible": "^Open thread$" }
- { "assertNotVisible": "^Refresh thread$" }
- {
    "runScript":
      {
        "file": "../../../tmp/threads-ios-preview/fixture-control.js",
        "env": { "CONTROL_JSON": '{"state":"ready","broadcast":false}' },
      },
  }
- { "tapOn": "^Retry loading Writable thread — fixture$" }
- {
    "extendedWaitUntil":
      { "visible": ".*Disposable fixture thread; no real agent or authority is affected.*", "timeout": 30000 },
  }
- { "assertNotVisible": ".*Fixture thread read failed.*" }
- { "assertNotVisible": "^Retry loading Writable thread — fixture$" }
- { "assertVisible": "^Open thread$" }
