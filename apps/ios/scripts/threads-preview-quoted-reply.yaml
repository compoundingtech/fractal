# Fixture/preliminary source preparation; NOT RUN against the revised UI.
appId: com.compoundingtech.fractal.starter
---
- {
    "runScript":
      {
        "file": "../../../tmp/threads-ios-preview/fixture-control.js",
        "env": { "CONTROL_JSON": '{"state":"quoted"}' },
      },
  }
- { "runFlow": { "file": "threads-preview-thread.yaml", "env": { "THREAD_TITLE": "Quoted reply — fixture" } } }
- { "extendedWaitUntil": { "visible": ".*Should this reply retain the original quoted context.*", "timeout": 30000 } }
- { "longPressOn": ".*Should this reply retain the original quoted context.*" }
- { "extendedWaitUntil": { "visible": ".*Replying to Atlas Builder.*", "timeout": 30000 } }
- { "tapOn": "^Message thread$" }
- { "inputText": "Fixture quoted reply preserves context." }
- { "tapOn": "^Send$" }
- hideKeyboard
- { "extendedWaitUntil": { "visible": ".*Fixture quoted reply preserves context.*", "timeout": 30000 } }
# PREVIEW_FINAL_ASSERTIONS
- { "assertVisible": ".*Fixture quoted reply preserves context.*" }
- { "assertVisible": ".*Reply to Atlas Builder.*Should this reply retain the original quoted context.*" }
