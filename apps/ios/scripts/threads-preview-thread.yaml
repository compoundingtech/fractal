# Fixture/preliminary; independent navigation helper, no business assertions.
appId: com.compoundingtech.fractal.starter
---
- openLink:
    link: "com.compoundingtech.fractal.starter://agent?id=agent/example/atlas/builder"
- runFlow:
    when:
      visible: "Open in.*Fractal Dev.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "^Threads, [0-9]+( or more)?$"
    timeout: 30000
- runFlow:
    when:
      notVisible: "${THREAD_TITLE}, [0-9]+ messages?.*"
    commands:
      - tapOn: "^Threads, [0-9]+( or more)?$"
- scrollUntilVisible:
    element:
      text: "${THREAD_TITLE}, [0-9]+ messages?.*"
    direction: DOWN
    timeout: 30000
- tapOn: "${THREAD_TITLE}, [0-9]+ messages?.*"
- scrollUntilVisible:
    element:
      text: "^Open thread$"
    direction: DOWN
    timeout: 30000
# The expanded Threads group scrolls within y=272..709 on the preview phone.
# Screen visibility alone admits a clipped footer whose center is outside that
# viewport. Start and end this upward gesture inside the group, not the page.
- swipe:
    start: 85%, 70%
    end: 85%, 45%
    duration: 600
- assertVisible: "^Open thread$"
- tapOn: "^Open thread$"
- extendedWaitUntil:
    visible: "^${THREAD_TITLE}$"
    timeout: 30000
- assertVisible:
    id: "^BackButton$"
- assertNotVisible: "^Open thread$"
