# The Markdown parser the web kit can load as WebAssembly: pulldown-cmark, emitting the kit's syntax tree (mdast JSON).
# A standalone workspace with its own lock file, so the Fractal workspace never builds or vendors it. Regenerate the
# committed module with `node packages/fractal-ui/scripts/generate-markdown-wasm.mjs`.
[package]
name = "fractal-markdown-wasm"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pulldown-cmark = { version = "=0.13.5", default-features = false }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
